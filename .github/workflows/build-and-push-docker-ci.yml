name: Release Docker Checks

on:
  pull_request:
    paths:
      - 'ci-workflows/build-and-push-docker/**'
      - '.github/workflows/build-and-push-docker.yml'
      - '.github/workflows/build-and-push-docker-ci.yml'
      - 'ci-workflows/release-pypi/scripts/post_data.py'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'ci-workflows/build-and-push-docker/**'
      - '.github/workflows/build-and-push-docker.yml'
      - '.github/workflows/build-and-push-docker-ci.yml'
      - 'ci-workflows/release-pypi/scripts/post_data.py'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: release-docker-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline regression / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Check out code under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --no-input pytest PyYAML requests cryptography
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest ci-workflows/build-and-push-docker/tests -q -p no:cacheprovider
