name: Reusable Build And Push Release Docker

# Build only trusted caller code; Dockerfile RUN instructions execute code.
# The Artifactory repository is /artifactory/docker_release/; Docker clients use the address below.
# The image address is fixed to download.t-head.cn/docker_release/<docker_name>-<git_tag_or_commit>:<docker_tag>.
on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Dockerfile path relative to the caller repository root, such as docker/Dockerfile'
        required: true
        type: string
      build_context:
        description: 'Build context directory relative to the caller repository root; only local directories within the repository are supported'
        required: false
        type: string
        default: '.'
      build_args:
        description: 'Optional Docker ARG values, one KEY=VALUE per line; not shell arguments, and must not contain passwords or tokens'
        required: false
        type: string
        default: ''
      docker_name:
        description: 'Lowercase base image name, such as demo or team/demo; the exact Git tag or full commit SHA is appended automatically'
        required: true
        type: string
      docker_tag:
        description: 'Optional image tag, such as 1.0.0; defaults to the current UTC date (YYYY-MM-DD); up to 128 characters, without colons or paths'
        required: false
        type: string
        default: ''
      os:
        description: 'Required release metadata: operating system, such as ubuntu24.04; does not select the runner'
        required: true
        type: string
      python:
        description: 'Required release metadata: Python version, such as 3.12'
        required: true
        type: string
      hggcrt:
        description: 'Required release metadata: HGGCRT version, such as 3'
        required: true
        type: string
      sdk_version:
        description: 'Required release metadata: SDK version, such as 2.2.0'
        required: true
        type: string
      torch:
        description: 'Required release metadata: PyTorch version, such as 2.13.0'
        required: true
        type: string
      network:
        description: 'Required release metadata: exactly one of mellanox, EIC, mellanox/EIC (case-sensitive)'
        required: true
        type: string
      template_repository:
        description: 'Repository containing this workflow and its scripts, in owner/repo format'
        required: false
        type: string
        default: t-head/ci-infra
      template_ref:
        description: 'Must match the ref used to call this workflow; a commit SHA is recommended; use github.sha for same-repository relative-path calls'
        required: true
        type: string
    outputs:
      image:
        description: 'Full image address in the format download.t-head.cn/docker_release/<docker_name>-<git_tag_or_commit>:<docker_tag>'
        value: ${{ jobs.build-and-push.outputs.image }}
      digest:
        description: 'Digest of the pushed image or image index, such as sha256:...'
        value: ${{ jobs.build-and-push.outputs.digest }}
      size:
        description: 'linux/amd64 image config and stored layer size in bytes; excludes manifests and attestations'
        value: ${{ jobs.build-and-push.outputs.size }}
    secrets:
      template_token:
        description: 'Read-only token for checking out a private template repository; usually unnecessary for same-repository calls or public templates'
        required: false
      release_username:
        description: 'Image registry publishing username from a caller repository or organization Actions Secret'
        required: true
      release_token:
        description: 'Image registry publishing token from a caller repository or organization Actions Secret'
        required: true
      data_token:
        description: 'Release data API client RSA private key, encoded as Base64 unencrypted DER (PKCS8)'
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push release Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.validate.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      size: ${{ steps.inspect.outputs.size }}
    steps:
      - name: Check out caller source
        uses: actions/checkout@v4
        with:
          path: caller-source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # Isolate template scripts from the build context to keep templates and checkout credentials out of the image.
      - name: Check out template tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: Set up Python for validation and release data
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Docker build inputs
        id: validate
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/caller-source
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python ci-template/ci-workflows/build-and-push-docker/scripts/validate_inputs.py

      - name: Validate publishing credentials
        shell: bash
        env:
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
          CLIENT_PRIVATE_KEY_B64: ${{ secrets.data_token }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_USERNAME//[[:space:]]/}" || -z "${RELEASE_TOKEN//[[:space:]]/}" || -z "${CLIENT_PRIVATE_KEY_B64//[[:space:]]/}" ]]; then
            printf '%s\n' '::error::Publishing username, registry token, and release data private key must not be empty' >&2
            exit 1
          fi

      - name: Install release data dependencies
        shell: bash
        run: python -m pip install --no-input requests cryptography

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to release image registry
        uses: docker/login-action@v3
        with:
          registry: download.t-head.cn
          username: ${{ secrets.release_username }}
          password: ${{ secrets.release_token }}
          logout: true

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.validate.outputs.build_context }}
          file: ${{ steps.validate.outputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          tags: ${{ steps.validate.outputs.image }}
          platforms: linux/amd64
          push: true

      - name: Inspect pushed image size
        id: inspect
        shell: bash
        env:
          IMAGE: ${{ steps.validate.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python ci-template/ci-workflows/build-and-push-docker/scripts/inspect_image.py

      - name: Print image address, digest and size
        shell: bash
        env:
          IMAGE: ${{ steps.validate.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SIZE: ${{ steps.inspect.outputs.size }}
        run: |
          set -euo pipefail
          printf 'Pushed image: %s\nImage digest: %s\nImage size (bytes): %s\n' "$IMAGE" "$DIGEST" "$SIZE" | tee -a "$GITHUB_STEP_SUMMARY"

      # Assemble and publish metadata only after the build, push, and image size inspection succeed.
      - name: Publish Docker release data
        shell: bash
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          SOURCE_REVISION: ${{ steps.validate.outputs.source_revision }}
          RESOLVED_DOCKER_TAG: ${{ steps.validate.outputs.docker_tag }}
          IMAGE: ${{ steps.validate.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SIZE: ${{ steps.inspect.outputs.size }}
          CLIENT_PRIVATE_KEY_B64: ${{ secrets.data_token }}
        run: python ci-template/ci-workflows/build-and-push-docker/scripts/post_data.py
