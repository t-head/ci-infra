name: Cluster Run Checks

on:
  pull_request:
    paths:
      - 'cluster-run/**'
      - '.github/workflows/cluster-run-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cluster-run/**'
      - '.github/workflows/cluster-run-ci.yml'

permissions:
  contents: read

concurrency:
  group: cluster-run-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKER_IMAGE: ${{ vars.PPU_TEST_IMAGE }}
  TEST_NAMESPACE: ppu-sched
  SMOKE_COMMAND: |
    set -euo pipefail
    test -f /workspace/source/cluster-run/action.yml
    test -f /workspace/source/README.md
    test -d /nas_aisw
    test -d /mnt/wl_nas
    printf 'rank=%s node_rank=%s world_size=%s nodes=%s cards=%s\n' "$RANK" "$NODE_RANK" "$WORLD_SIZE" "$NNODES" "$NPROC_PER_NODE"
    ppu-smi
    sleep 30

  MASTER_SMOKE_COMMAND: |
    set -euo pipefail
    test "$RANK" = 0
    test "$WORLD_SIZE" = 2
    test "$NNODES" = 2
    test "$NPROC_PER_NODE" = 1
    test "$CI_MASTER_SETUP" = setup-0
    test -f /workspace/source/cluster-run/action.yml
    job_id="$(< /run/cluster/job-id)"
    registry="/mnt/wl_nas/devops/runtime/master/$job_id/nodes"
    mkdir "/mnt/wl_nas/devops/runtime/master/$job_id/master-command-once"
    jq -e 'type == "array" and length == 2 and .[0].rank == 0 and .[1].rank == 1 and all(.[]; .cards == 1 and .port >= 1 and .port <= 65535)' "$CLUSTER_NODES_FILE"
    verify_node='set -euo pipefail
    test "$RANK" = "$1"
    test "$NODE_RANK" = "$1"
    test "$WORLD_SIZE" = 2
    test "$CI_MASTER_SETUP" = "setup-$1"
    test -s /run/cluster/known_hosts
    test -s /run/cluster/authorized_keys
    test -s /run/cluster/identity
    for peer in 0 1; do
      peer_host="$(jq -r --argjson rank "$peer" '\''.[$rank].host'\'' "$CLUSTER_NODES_FILE")"
      cluster-exec "$peer_host" /bin/bash -c '\''set -euo pipefail; test "$RANK" = "$1"; test "$WORLD_SIZE" = 2'\'' fixture "$peer"
    done
    printf "verified-rank=%s world=%s setup=%s\\n" "$RANK" "$WORLD_SIZE" "$CI_MASTER_SETUP"
    '
    for rank in 0 1; do
      jq -e --argjson rank "$rank" --arg job "$job_id" '.rank == $rank and .jobid == $job and .port >= 1 and .port <= 65535' "$registry/$rank.json"
      host="$(jq -r --argjson rank "$rank" '.[$rank].host' "$CLUSTER_NODES_FILE")"
      cluster-exec "$host" /bin/bash -c "$verify_node" fixture "$rank"
    done
    printf 'master-command-once\n'

jobs:
  checks:
    name: Check action sources
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect action definition
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          action = YAML.safe_load(File.read("cluster-run/action.yml"), aliases: true)
          abort "expected runs.using to be composite" unless action.dig("runs", "using") == "composite"
          composite_steps = action.dig("runs", "steps")
          abort "expected at least one composite step" unless composite_steps.is_a?(Array) && composite_steps.any?
          values = action.fetch("outputs").values.map { |item| item["value"] } + composite_steps.flat_map { |item| (item["env"] || {}).values }
          abort "keep status predicates out of output and environment expressions" if values.any? { |item| item.to_s.match?(/\b(always|cancelled|failure|success)\(/) }

          %w[command image].each do |name|
            abort "expected #{name} to be required" unless action.dig("inputs", name, "required") == true
          end
          RUBY

      - name: Install isolated test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server jq util-linux sudo

      - name: Parse Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            printf 'Parsing %s\n' "$file"
            bash -n "$file"
          done < <(find cluster-run/scripts -type f -name '*.sh' -print0)

      - name: Exercise scheduling and monitoring transitions
        shell: bash
        run: python3 cluster-run/tests/test-lifecycle.py

      - name: Cover source transfer and workflow assertions
        shell: bash
        run: python3 cluster-run/tests/test-staging.py

      - name: Exercise real two-node SSH runtime and port collision fallback
        shell: bash
        run: |
          sudo python3 - <<'PY'
          import importlib.util
          import unittest

          path = "cluster-run/tests/test-master-runtime.py"
          spec = importlib.util.spec_from_file_location("master_runtime_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          real = getattr(module, "RealSshdTests", None)
          names = unittest.defaultTestLoader.getTestCaseNames(real) if real else []
          required_groups = {
              "two-node public-key SSH": [name for name in names if "two_node" in name],
              "real sshd preferred-port collision": [name for name in names
                  if any(word in name for word in ("collision", "conflict", "fallback"))],
          }
          skipped = {test.id().rsplit(".", 1)[-1] for test, reason in result.skipped}
          for label, required in required_groups.items():
              if not required or all(name in skipped for name in required):
                  raise SystemExit("Required real SSH coverage missing or skipped: " + label)
          if any("setUpClass" in test.id() and "RealSshdTests" in test.id()
                 for test, reason in result.skipped):
              raise SystemExit("Real SSH test class cannot be skipped on the Linux CI runner")
          PY

      - name: Cover SSH installer and cache behavior
        shell: bash
        run: python3 cluster-run/tests/test-ssh-install.py

      - name: Verify generated names
        shell: bash
        run: |
          set -euo pipefail

          first=$(env GITHUB_REPOSITORY_OWNER=t-head GITHUB_JOB_NAME=integration GITHUB_RUN_ID=654321 GITHUB_RUN_ATTEMPT=2 PPU_RUNNER_NAME=ppu-runner-01 MATRIX_JSON='{"suite":"distributed"}' bash cluster-run/scripts/job-name.sh)
          duplicate=$(env GITHUB_REPOSITORY_OWNER=t-head GITHUB_JOB_NAME=integration GITHUB_RUN_ID=654321 GITHUB_RUN_ATTEMPT=2 PPU_RUNNER_NAME=ppu-runner-01 MATRIX_JSON='{"suite":"distributed"}' bash cluster-run/scripts/job-name.sh)
          concurrent=$(env GITHUB_REPOSITORY_OWNER=t-head GITHUB_JOB_NAME=integration GITHUB_RUN_ID=654321 GITHUB_RUN_ATTEMPT=2 PPU_RUNNER_NAME=ppu-runner-02 MATRIX_JSON='{"suite":"distributed"}' bash cluster-run/scripts/job-name.sh)

          test "$first" = "$duplicate"
          test "$first" != "$concurrent"
          [[ "$first" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?-[a-f0-9]{6}$ ]]
          test "${#first}" -le 52

  accelerator-smoke:
    name: Exercise ${{ matrix.label }}
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: one 890P card
            nodes: 0
            devices: 1
            board_type: ZW-M890P
          - label: eight 890P cards
            nodes: 0
            devices: 8
            board_type: ZW-M890P
          - label: two 890P workers
            nodes: 2
            devices: 8
            board_type: ZW-M890P
          - label: one 810E card
            nodes: 0
            devices: 1
            board_type: OAM-810E
          - label: one ZW-810E card
            nodes: 0
            devices: 1
            board_type: ZW-810E
          - label: eight 810E cards
            nodes: 0
            devices: 8
            board_type: OAM-810E
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Launch ${{ matrix.label }} workload
        id: smoke
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: ${{ matrix.nodes }}
          nproc_per_node: ${{ matrix.devices }}
          node_selector: board-type=${{ matrix.board_type }}
          dmesg_policy: always
          timeout_minutes: 10
          command: ${{ env.SMOKE_COMMAND }}

      - name: Assert reported results
        shell: bash
        env:
          REPORTED_NAME: ${{ steps.smoke.outputs.job_name }}
          REPORTED_STATUS: ${{ steps.smoke.outputs.job_status }}
          REPORTED_PODS: ${{ steps.smoke.outputs.task_pods }}
          REPORTED_QUEUE: ${{ steps.smoke.outputs.queue_duration_seconds }}
          REPORTED_OCCUPIED: ${{ steps.smoke.outputs.occupied_ppu_card_hours }}
          REPORTED_EXECUTION: ${{ steps.smoke.outputs.execution_ppu_card_hours }}
        run: |
          printf 'name=%s status=%s pods=%s\n' "$REPORTED_NAME" "$REPORTED_STATUS" "$REPORTED_PODS"
          printf 'queue=%ss occupied=%s execution=%s card-hours\n' "$REPORTED_QUEUE" "$REPORTED_OCCUPIED" "$REPORTED_EXECUTION"
          [ -n "$REPORTED_NAME" ]
          [ "$REPORTED_STATUS" = succeeded ]
          [[ "$REPORTED_QUEUE" =~ ^[0-9]+$ ]]
          [[ "$REPORTED_OCCUPIED" =~ ^[0-9]+\.[0-9]{4}$ ]]
          [[ "$REPORTED_EXECUTION" =~ ^[0-9]+\.[0-9]{4}$ ]]

  lifecycle-check:
    name: Inspect ${{ matrix.label }} lifecycle
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: immediate completion
            workload: "printf 'early-workload-log\\nfinal-workload-log\\n'; exit 0"
            expected_status: succeeded
            expected_outcome: success
            minutes: 10
          - label: command failure
            workload: "printf 'early-workload-log\\nfinal-workload-log\\n'; exit 7"
            expected_status: failed
            expected_outcome: failure
            minutes: 10
          - label: runtime deadline
            workload: "printf 'early-workload-log\\n'; sleep 300"
            expected_status: timeout
            expected_outcome: failure
            minutes: 3
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run scheduling and log phases
        id: lifecycle
        continue-on-error: true
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          timeout_minutes: ${{ matrix.minutes }}
          command: ${{ matrix.workload }}

      - name: Assert final state and removed pods
        shell: bash
        env:
          ALLOCATION_NAME: ${{ steps.lifecycle.outputs.job_name }}
          ALLOCATION_STATUS: ${{ steps.lifecycle.outputs.job_status }}
          ALLOCATION_OUTCOME: ${{ steps.lifecycle.outcome }}
          REQUIRED_STATUS: ${{ matrix.expected_status }}
          REQUIRED_OUTCOME: ${{ matrix.expected_outcome }}
          EXECUTION_CARD_HOURS: ${{ steps.lifecycle.outputs.execution_ppu_card_hours }}
        run: |
          [ "$ALLOCATION_STATUS" = "$REQUIRED_STATUS" ]
          [ "$ALLOCATION_OUTCOME" = "$REQUIRED_OUTCOME" ]
          pods="$(kubectl get pods -n "$TEST_NAMESPACE" -l "ppu-job=$ALLOCATION_NAME" -o name)"
          test -z "$pods"
          if [ "$REQUIRED_STATUS" = timeout ]; then
            awk -v value="$EXECUTION_CARD_HOURS" 'BEGIN { exit !(value > 0) }'
          fi

  ssh-cache-check:
    name: Verify Aliyun APT download and offline cache reuse
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SSH from signed repositories and reuse the cache offline
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/openssh-cache"
          mkdir -p "$cache"
          docker pull ubuntu:24.04
          image="$(docker image inspect --format '{{.Id}}' ubuntu:24.04)"
          deadline="$(( $(date +%s) + 900 ))"
          docker run --rm \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-run/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            "$image" /bin/bash /action/install-ssh.sh 2>&1 \
            | tee "$RUNNER_TEMP/openssh-download.log"
          grep -q 'published authenticated dependency cache' "$RUNNER_TEMP/openssh-download.log"
          test -n "$(sudo find "$cache" -path '*metadata/mirrors.aliyun.com*InRelease' -type f -print -quit)"
          test -n "$(sudo find "$cache" -name COMPLETE -type f -print -quit)"
          deadline="$(( $(date +%s) + 600 ))"
          docker run --rm --network none \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-run/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            "$image" /bin/bash /action/install-ssh.sh 2>&1 \
            | tee "$RUNNER_TEMP/openssh-offline.log"
          grep -q 'authenticated offline cache hit' "$RUNNER_TEMP/openssh-offline.log"

  master-lifecycle-check:
    name: Inspect ${{ matrix.label }} lifecycle
    needs: [checks, ssh-cache-check]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master-success
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'exit 0'
            expected_status: succeeded
            expected_outcome: success
            minutes: 10
          - label: master-command-fail
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'printf 7 > "$CI_MASTER_PROOF_DIR/master-command-fault"; chmod 0644 "$CI_MASTER_PROOF_DIR/master-command-fault"; exit 7'
            expected_status: failed
            expected_outcome: failure
            minutes: 10
          - label: worker-setup-fail
            setup: 'export CI_MASTER_SETUP="setup-$RANK"; if [ "$RANK" = 1 ]; then printf 7 > "$CI_MASTER_PROOF_DIR/worker-setup-fault"; chmod 0644 "$CI_MASTER_PROOF_DIR/worker-setup-fault"; exit 7; fi'
            workload: 'printf "A failed worker setup unexpectedly allowed the master command\\n"; exit 0'
            expected_status: failed
            expected_outcome: failure
            minutes: 10
          - label: master-timeout
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'printf started > "$CI_MASTER_PROOF_DIR/timeout-command-started"; chmod 0644 "$CI_MASTER_PROOF_DIR/timeout-command-started"; sleep 300'
            expected_status: timeout
            expected_outcome: failure
            minutes: 3
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require Secret create and delete permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /opt/bin/kubectl ]; then export PATH="/opt/bin:$PATH"; fi
          command -v kubectl
          for verb in create delete get; do
            if ! timeout --signal=KILL 10s kubectl auth can-i "$verb" secrets -n "$TEST_NAMESPACE"; then
              printf '::error::Master CI requires %s permission for Secrets in %s\n' "$verb" "$TEST_NAMESPACE"
              exit 1
            fi
          done

      - name: Prepare master execution evidence
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "/wl_nas/devops/master-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Launch two-node master lifecycle fixture
        id: master
        continue-on-error: true
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: 2
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          launch_mode: master
          ssh_port: 2222
          extra_env: CI_MASTER_PROOF_DIR=${{ steps.proof.outputs.directory }}
          setup_command: |
            printf 'setup-%s\n' "$RANK" > "$CI_MASTER_PROOF_DIR/setup-$RANK"
            chmod 0644 "$CI_MASTER_PROOF_DIR/setup-$RANK"
            ${{ matrix.setup }}
          timeout_minutes: ${{ matrix.minutes }}
          job_suffix: ${{ matrix.label }}
          command: |
            ${{ env.MASTER_SMOKE_COMMAND }}
            printf reached > "$CI_MASTER_PROOF_DIR/master-command-reached"
            chmod 0644 "$CI_MASTER_PROOF_DIR/master-command-reached"
            ${{ matrix.workload }}

      - name: Assert master terminal state
        if: always() && steps.master.outcome != 'skipped'
        shell: bash
        env:
          ALLOCATION_STATUS: ${{ steps.master.outputs.job_status }}
          ALLOCATION_OUTCOME: ${{ steps.master.outcome }}
          REQUIRED_STATUS: ${{ matrix.expected_status }}
          REQUIRED_OUTCOME: ${{ matrix.expected_outcome }}
          EXECUTION_CARD_HOURS: ${{ steps.master.outputs.execution_ppu_card_hours }}
          REQUIRED_SCENARIO: ${{ matrix.label }}
          PROOF_DIR: ${{ steps.proof.outputs.directory }}
        run: |
          if [ "$REQUIRED_SCENARIO" = worker-setup-fail ]; then
            test -s "$PROOF_DIR/setup-1"
            test "$(< "$PROOF_DIR/worker-setup-fault")" = 7
            test ! -e "$PROOF_DIR/master-command-reached"
          else
            test -s "$PROOF_DIR/setup-0"
            test -s "$PROOF_DIR/setup-1"
            test -s "$PROOF_DIR/master-command-reached"
          fi
          if [ "$REQUIRED_SCENARIO" = master-command-fail ]; then
            test "$(< "$PROOF_DIR/master-command-fault")" = 7
          elif [ "$REQUIRED_SCENARIO" = master-timeout ]; then
            test -s "$PROOF_DIR/timeout-command-started"
          fi
          test "$ALLOCATION_STATUS" = "$REQUIRED_STATUS"
          test "$ALLOCATION_OUTCOME" = "$REQUIRED_OUTCOME"
          if [ "$REQUIRED_STATUS" = timeout ]; then
            awk -v value="$EXECUTION_CARD_HOURS" 'BEGIN { exit !(value > 0) }'
          fi

      - name: Require full master resource cleanup
        if: always() && steps.master.outputs.job_name != ''
        shell: bash
        env:
          ALLOCATION_NAME: ${{ steps.master.outputs.job_name }}
        run: |
          set -euo pipefail
          test -n "$ALLOCATION_NAME"
          pods="$(timeout --signal=KILL 10s kubectl get pods -n "$TEST_NAMESPACE" -l "ppu-job=$ALLOCATION_NAME" -o name)"
          test -z "$pods"
          for resource in svc podgroups.scheduling.x-k8s.io; do
            remaining="$(timeout --signal=KILL 10s kubectl get "$resource" "$ALLOCATION_NAME" -n "$TEST_NAMESPACE" --ignore-not-found=true -o name)"
            test -z "$remaining"
          done
          secret="$(timeout --signal=KILL 10s kubectl get secret "$ALLOCATION_NAME-ssh" -n "$TEST_NAMESPACE" --ignore-not-found=true -o name)"
          test -z "$secret"
          # Job IDs include the random attempt nonce; never inspect or delete another job.
          shopt -s nullglob
          runtime_dirs=(/wl_nas/devops/runtime/master/"$ALLOCATION_NAME"-*)
          test "${#runtime_dirs[@]}" -eq 0

      - name: Remove master execution evidence
        if: always() && steps.proof.outputs.directory != ''
        shell: bash
        env:
          PROOF_DIR: ${{ steps.proof.outputs.directory }}
        run: |
          set -euo pipefail
          prefix="/wl_nas/devops/master-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          suffix="${PROOF_DIR#"$prefix"}"
          [[ "$suffix" =~ ^[a-zA-Z0-9]+$ ]]
          test "$PROOF_DIR" = "$prefix$suffix"
          test ! -L "$PROOF_DIR"
          rm -rf -- "$PROOF_DIR"

  default-limit-check:
    name: Inspect ${{ matrix.board_type }} limits
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_type: ZW-M890P
            expected_cores: 31
            expected_gib: 256
          - board_type: OAM-810E
            expected_cores: 11
            expected_gib: 112
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read enforced cgroup limits
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: 0
          nproc_per_node: 1
          job_suffix: limits-${{ matrix.board_type }}
          node_selector: board-type=${{ matrix.board_type }}
          dmesg_policy: always
          timeout_minutes: 10
          command: |
            ${{ env.SMOKE_COMMAND }}
            python3 - <<'PY'
            from pathlib import Path

            cores = ${{ matrix.expected_cores }}
            memory_bytes = ${{ matrix.expected_gib }} * 1024**3

            if Path("/sys/fs/cgroup/cpu.max").exists():
                quota, period = Path("/sys/fs/cgroup/cpu.max").read_text().split()
            else:
                quota = Path("/sys/fs/cgroup/cpu/cpu.cfs_quota_us").read_text().strip()
                period = Path("/sys/fs/cgroup/cpu/cpu.cfs_period_us").read_text().strip()
            if quota == "max" or int(quota) / int(period) != cores:
                raise SystemExit(f"unexpected CPU limit: cores={cores}, quota={quota}, period={period}")

            if Path("/sys/fs/cgroup/memory.max").exists():
                actual_memory = Path("/sys/fs/cgroup/memory.max").read_text().strip()
            else:
                actual_memory = Path("/sys/fs/cgroup/memory/memory.limit_in_bytes").read_text().strip()
            if actual_memory == "max" or int(actual_memory) != memory_bytes:
                raise SystemExit(f"unexpected memory limit: expected={memory_bytes}, actual={actual_memory}")
            PY

  capacity-block-check:
    name: Reject an unavailable 8-node 810E allocation
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Submit oversized 810E gang
        id: blocked_allocation
        continue-on-error: true
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: 8
          nproc_per_node: 16
          node_selector: board-type=OAM-810E
          dmesg_policy: on_failure
          timeout_minutes: 3
          command: echo 'An unavailable allocation unexpectedly started' && exit 1

      - name: Require the expected timeout
        shell: bash
        env:
          ALLOCATION_OUTCOME: ${{ steps.blocked_allocation.outcome }}
          ALLOCATION_STATUS: ${{ steps.blocked_allocation.outputs.job_status }}
        run: |
          printf 'outcome=%s status=%s\n' "$ALLOCATION_OUTCOME" "$ALLOCATION_STATUS"
          [ "$ALLOCATION_OUTCOME" = failure ]
          [ "$ALLOCATION_STATUS" = timeout ]

  build-fixture:
    name: Create transfer fixture
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create marker
        shell: bash
        run: |
          mkdir -p transfer-fixture
          printf 'scheduler-action-checks\n' > transfer-fixture/marker.txt

      - name: Store marker
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-action-transfer-fixture
          path: transfer-fixture/

  staging-check:
    name: Check staging with ${{ matrix.label }}
    needs: build-fixture
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: a single card
            nodes: 0
            devices: 1
          - label: two workers
            nodes: 2
            devices: 8
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Fetch this revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore marker outside the checkout
        uses: actions/download-artifact@v4
        with:
          name: scheduler-action-transfer-fixture
          path: ${{ runner.temp }}/restored-fixture

      - name: Inspect staged repository and marker
        uses: $/cluster-run
        with:
          image: ${{ env.WORKER_IMAGE }}
          namespace: ${{ env.TEST_NAMESPACE }}
          nnodes: ${{ matrix.nodes }}
          nproc_per_node: ${{ matrix.devices }}
          node_selector: board-type=ZW-M890P
          dmesg_policy: always
          timeout_minutes: 10
          artifact_paths: ${{ runner.temp }}/restored-fixture
          command: |
            set -euo pipefail
            test -f /workspace/source/cluster-run/action.yml
            test -f /workspace/source/README.md
            test -f /workspace/source/restored-fixture/marker.txt
            grep -qx scheduler-action-checks /workspace/source/restored-fixture/marker.txt
            ppu-smi
