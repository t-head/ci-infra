name: Release PyPI Checks

on:
  pull_request:
    paths:
      - 'ci-workflows/release-pypi/**'
      - '.github/workflows/matrix-release.yml'
      - '.github/workflows/release-pypi-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ci-workflows/release-pypi/**'
      - '.github/workflows/matrix-release.yml'
      - '.github/workflows/release-pypi-ci.yml'

permissions:
  contents: read

concurrency:
  group: release-pypi-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline Regression / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --no-input pytest PyYAML packaging setuptools wheel requests cryptography
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest ci-workflows/release-pypi/tests -q -p no:cacheprovider
