name: Reusable Matrix Release

# Arrays are passed as JSON strings; the image mapping is maintained in ci-workflows/release-pypi/scripts/prepare_matrix.py.
# This file is called by callers via job-level uses; the manual trigger entry point is provided by the caller.
# For cross-repository calls, template_ref must match the version used in the uses statement; pinning to a commit SHA is recommended.
# A private template repository must allow cross-repository calls and grant read-only access to the template code via template_token.
on:
  workflow_call:
    inputs:
      package_name:
        description: 'Name of the package to build and publish, for example deep-gemm; the entry point replaces - with _ and it does not participate in matrix expansion'
        required: true
        type: string
      framework:
        description: 'Name of the dependent framework, for example torch; does not participate in matrix expansion'
        required: true
        type: string
      python_versions:
        description: 'JSON array, allowed values: 38, 310, 312, for example ["38","310"]'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array, allowed values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array, allowed values: 2, 3, for example ["2","3"]'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON array, allowed values: 2.10.0, 2.13.0; [""] means no Torch version is included'
        required: true
        type: string
        default: '["2.10.0"]'
      sdk_versions:
        description: 'JSON array, allowed values: 2.1.1, 2.2.0'
        required: true
        type: string
        default: '["2.2.0"]'
      pccl_version:
        description: 'Allowed values: 2.1.1,2.2.0, 2.2.1'
        required: false
        type: string
        default: '2.2.1'
      template_repository:
        description: 'Repository holding this workflow and prepare_matrix.py, in owner/repo format'
        type: string
        required: false
        default: t-head/ci-infra
      template_ref:
        description: 'Template code version, must match the ref that invokes this workflow; pass github.sha for relative-path calls within this repository'
        required: true
        type: string
      build_command:
        description: 'Bash build command executed in the caller repository root, multi-line supported; only trusted configuration is accepted'
        required: true
        type: string
      tag_version:
        description: 'Optional release version, taking precedence over repository tags, for example 1.0.0 or V1.0.0+v0.3.0; a leading v/V is stripped from all version sources while inner content stays unchanged; must satisfy PEP 440 and the existing tag format, invalid values raise an error, and a version containing rc (case-insensitive) only builds wheels and saves artifacts without publishing; does not change the checked-out code version'
        required: false
        type: string
        default: ''
    secrets:
      template_token:
        description: 'Read-only token for checking out a private template repository; usually not needed for same-repository or public templates'
        required: false
      release_username:
        description: 'Release username, from the caller repository or organization-level Actions Secret'
        required: true
      release_token:
        description: 'Release token, from the caller repository or organization-level Actions Secret'
        required: true
      data_token:
        description: 'Release data Open API client RSA private key, Base64-encoded unencrypted DER format'
        required: true

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Validate inputs and generate matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_release: ${{ steps.matrix.outputs.should_release }}
      package_name: ${{ steps.normalize-package.outputs.package_name }}
    steps:
      - name: Normalize package name
        id: normalize-package
        shell: bash
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          inputs = json.loads(os.environ["INPUTS_JSON"])
          package_name = inputs.get("package_name", "")
          if not isinstance(package_name, str) or not re.fullmatch(
              r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name
          ):
              raise SystemExit("::error::package_name must be a valid Python package name")
          package_name = package_name.replace("-", "_")
          inputs["package_name"] = package_name
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_name={package_name}\n")
              output.write("inputs_json=" + json.dumps(inputs, separators=(",", ":")) + "\n")
          PY

      # - name: Validate caller organization
      #   shell: bash
      #   env:
      #     CALLER_ORGANIZATION: ${{ github.repository_owner }}
      #   run: |
      #     set -euo pipefail
      #     shopt -s nocasematch
      #     # The pinned list of allowed organizations; must not come from inputs the caller can modify.
      #     if [[ "$CALLER_ORGANIZATION" != "t-head" ]]; then
      #       printf '%s\n' '::error::only repositories in the t-head organization may call this workflow' >&2
      #       exit 1
      #     fi

      - name: Checkout caller version history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: caller-source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout template tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false
      - name: Set up matrix validation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install version validation dependencies
        shell: bash
        run: python3 -m pip install --no-input packaging

      - name: Parse version arrays and image mapping
        id: matrix
        shell: bash
        env:
          INPUTS_JSON: ${{ steps.normalize-package.outputs.inputs_json }}
          SOURCE_DIR: caller-source
        run: python3 ci-template/ci-workflows/release-pypi/scripts/prepare_matrix.py

  build-sdist:
    name: Build sdist
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload-sdist.outputs.artifact-id }}
    steps:
      - name: Checkout caller repository with full version history
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout sdist template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: Set up Python for sdist build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sdist build dependencies
        shell: bash
        run: python -m pip install --no-input setuptools wheel packaging

      - name: Fill template and build sdist
        shell: bash
        env:
          pkg_name: ${{ needs.prepare-matrix.outputs.package_name }}
          framework: ${{ inputs.framework }}
          MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          # Restrict substituted values to avoid breaking the sed expressions or the generated Python strings.
          if [[ ! "$pkg_name" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]]; then
            printf '%s\n' '::error::package_name must be a valid Python package name' >&2
            exit 1
          fi
          if [[ -n "$framework" && ! "$framework" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
            printf '%s\n' '::error::framework must be empty or a valid Python module name' >&2
            exit 1
          fi

          # Use the release versions from the matrix directly: validate all versions and deduplicate first, then build one by one.
          release_versions="$(python - <<'PY'
          import json
          import os
          import re
          from packaging.version import InvalidVersion, Version

          try:
              entries = json.loads(os.environ["MATRIX_JSON"])["include"]
              if not isinstance(entries, list) or not entries:
                  raise ValueError
              versions = []
              for entry in entries:
                  version = entry["release_version"]
                  if not isinstance(version, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", version):
                      raise ValueError
                  Version(version)
                  if version not in versions:
                      versions.append(version)
          except (KeyError, TypeError, ValueError, InvalidVersion):
              raise SystemExit("::error::matrix must contain a valid release_version")
          print("\n".join(versions))
          PY
          )"

          for placeholder in 'PACKAGE_NAME = ""' 'framework = ""' 'build_version = ""'; do
            if ! grep -Fxq "$placeholder" ci-template/ci-workflows/release-pypi/scripts/setup.py; then
              printf '%s\n' '::error::the sdist template is missing the expected placeholder fields' >&2
              exit 1
            fi
          done

          # Use a separate build directory per version to avoid mixing templates and egg-info; artifacts are collected together.
          mkdir -p sdist/dist
          dist_dir="$(pwd)/sdist/dist"
          export __FAKE_BUILD="FAKE_WHEEL"
          while IFS= read -r build_version; do
            build_dir="sdist/builds/$build_version"
            mkdir -p "$build_dir"
            sed \
              -e "s|^PACKAGE_NAME = \"\"$|PACKAGE_NAME = \"$pkg_name\"|" \
              -e "s|^framework = \"\"$|framework = \"$framework\"|" \
              -e "s|^build_version = \"\"$|build_version = \"$build_version\"|" \
              ci-template/ci-workflows/release-pypi/scripts/setup.py > "$build_dir/setup.py"
            (cd "$build_dir" && python setup.py sdist --dist-dir "$dist_dir")
            printf 'Built sdist version: %s\n' "$build_version"
          done <<< "$release_versions"

      - name: Save sdist build artifacts
        id: upload-sdist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-sdist-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdist/dist/*.tar.gz
          if-no-files-found: error

  matrix-job:
    name: py${{ matrix.python_version }} / ${{ matrix.os_version }} / runtime${{ matrix.runtime_version }} / torch${{ matrix.torch_version }} / sdk${{ matrix.sdk_version }}
    needs: [prepare-matrix, build-sdist]
    # The job condition is evaluated before matrix expansion; when skipped, the empty matrix output is not parsed and the build container is not started.
    # Non-release builds allow the sdist job to be skipped; release builds must still wait for the sdist to succeed.
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' && ((needs.prepare-matrix.outputs.should_release == 'false' && needs.build-sdist.result == 'skipped') || (needs.prepare-matrix.outputs.should_release == 'true' && needs.build-sdist.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      OS_VERSION: ${{ matrix.os_version }}
      RUNTIME_VERSION: ${{ matrix.runtime_version }}
      TORCH_VERSION: ${{ matrix.torch_version }}
      SDK_VERSION: ${{ matrix.sdk_version }}
      RELEASE_VERSION: ${{ matrix.release_version }}
      WHL_NAME: ${{ matrix.whl_name }}
      CONTAINER_IMAGE: ${{ matrix.image }}
      TORCH_URL: ${{ matrix.torch_url }}
      SDK_URL: ${{ matrix.sdk_url }}
      PCCL_URL: ${{ matrix.pccl_url }}
    defaults:
      run:
        shell: sh
    steps:
      - name: Print current matrix parameters
        run: |
          printf '%s\n' \
            "PYTHON_VERSION=$PYTHON_VERSION" \
            "OS_VERSION=$OS_VERSION" \
            "RUNTIME_VERSION=$RUNTIME_VERSION" \
            "TORCH_VERSION=$TORCH_VERSION" \
            "SDK_VERSION=$SDK_VERSION" \
            "RELEASE_VERSION=$RELEASE_VERSION" \
            "WHL_NAME=$WHL_NAME" \
            "TORCH_URL=$TORCH_URL" \
            "SDK_URL=$SDK_URL" \
            "PCCL_URL=$PCCL_URL" \
            "CONTAINER_IMAGE=$CONTAINER_IMAGE"
      - name: Checkout repository to build
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Download and install SDK run package
        shell: bash
        run: |
          set -euo pipefail
          : "${SDK_URL:?SDK_URL must not be empty}"
          download_dir="$(mktemp -d "$RUNNER_TEMP/ppu-sdk.XXXXXX")"
          wget --https-only --tries=3 --timeout=30 \
            -O "$download_dir/ppu-sdk.run" -- "$SDK_URL"
          if [[ ! -s "$download_dir/ppu-sdk.run" ]]; then
            printf '%s\n' '::error::the downloaded SDK run package is empty' >&2
            exit 1
          fi
          bash "$download_dir/ppu-sdk.run" --prefix=/usr/local --silent
          echo "/usr/local/PPU_SDK/lib" >> /etc/ld.so.conf.d/ppu.conf
          ldconfig

      - name: Download and install PCCL
        shell: bash
        env:
          PCCL_PATH: /usr/local/pccl
        run: |
          set -euo pipefail
          : "${PCCL_URL:?PCCL_URL must not be empty}"
          : "${PCCL_PATH:?PCCL_PATH must not be empty}"
          if [[ -e "$PCCL_PATH" || -L "$PCCL_PATH" ]]; then
            printf '%s\n' '::error::the PCCL install directory already exists, refusing to overwrite' >&2
            exit 1
          fi
          download_dir="$(mktemp -d "$RUNNER_TEMP/pccl.XXXXXX")"
          trap 'rm -rf -- "$download_dir"' EXIT
          wget --https-only --tries=3 --timeout=30 \
            -O "$download_dir/pccl.tar.gz" -- "$PCCL_URL"
          if [[ ! -s "$download_dir/pccl.tar.gz" ]]; then
            printf '%s\n' '::error::the downloaded PCCL package is empty' >&2
            exit 1
          fi
          mkdir "$download_dir/extracted"
          tar --extract --file="$download_dir/pccl.tar.gz" --directory="$download_dir/extracted"
          if [[ ! -d "$download_dir/extracted/pccl" || -L "$download_dir/extracted/pccl" ]]; then
            printf '%s\n' '::error::the PCCL package is missing the pccl directory or the directory is a symlink' >&2
            exit 1
          fi
          mv -- "$download_dir/extracted/pccl" "$PCCL_PATH"
          printf '%s\n' "$PCCL_PATH/lib" >> /etc/ld.so.conf.d/pccl.conf
          ldconfig
          printf 'PCCL_PATH=%s\n' "$PCCL_PATH" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -eo pipefail
          : "${BUILD_COMMAND:?build_command must not be empty}"
          ldconfig
          source /usr/local/PPU_SDK/envsetup.sh
          export PATH="$PCCL_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$PCCL_PATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          if [[ -n "${TORCH_VERSION:-}" ]]; then
            pip install "torch==$TORCH_VERSION" -i https://download.t-head.cn/artifactory/api/pypi/pypi_index/simple
          fi
          bash -e -o pipefail -c "$BUILD_COMMAND"

      - name: Collect wheels into dist
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path.cwd()
          dist = root / "dist"
          package_name = os.environ["PACKAGE_NAME"].lower().replace("-", "_")
          if not package_name:
              raise SystemExit("::error::package_name must not be empty")
          if dist.is_symlink() or (dist.exists() and not dist.is_dir()):
              raise SystemExit("::error::dist must be a regular directory, not a symlink")

          def scan_error(error):
              raise SystemExit(f"::error::cannot scan the source directory: {error}")

          # Find regular files recursively without following symlinks; finish filtering first to avoid same-name artifacts overwriting each other during copy.
          wheels = []
          for directory, _, filenames in os.walk(root, onerror=scan_error, followlinks=False):
              for filename in filenames:
                  path = Path(directory) / filename
                  if filename.endswith(".whl") and path.is_file() and not path.is_symlink():
                      wheels.append(path)
          wheels.sort()
          print("Found wheel files: " + json.dumps([str(path.relative_to(root)) for path in wheels],
                                               ensure_ascii=False), flush=True)
          if not wheels:
              raise SystemExit("::error::no .whl file found in the source directory")
          candidates = wheels
          if len(wheels) > 1:
              candidates = [path for path in wheels
                            if path.name.lower().replace("-", "_").startswith(package_name)]
          if len(candidates) != 1:
              raise SystemExit(f"::error::exactly one wheel must remain after filtering by package_name, got {len(candidates)}")

          selected = candidates[0]
          target = dist / selected.name
          existing = list(dist.glob("*.whl"))
          if any(path.is_symlink() or not path.is_file() for path in existing):
              raise SystemExit("::error::wheels in dist must be regular files, not symlinks")
          if selected != target and target.exists():
              raise SystemExit("::error::an artifact with the same name already exists in dist, refusing to overwrite")
          dist.mkdir(exist_ok=True)
          # Normalize the name only on match; keep the original name when copying; the selected artifact already in dist needs no copy.
          if selected != target:
              shutil.copy2(selected, target)
          # dist keeps only the selected wheel; originals in other source directories and non-wheel files stay untouched.
          for path in existing:
              if path != target:
                  path.unlink()
          print("Collected wheel: " + json.dumps(str(target.relative_to(root)), ensure_ascii=False))
          PY

      - name: Save collected wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-collected-wheels-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

      # The Docker action shares the workspace with the build container and repacks inside the specified tool image.
      - name: Repack wheel
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        uses: docker://download.t-head.cn/docker_tool/manylinux_revpkg:04
        with:
          entrypoint: /bin/bash
          args: |
            -euo pipefail -c "
            : \"${RELEASE_VERSION:?RELEASE_VERSION must not be empty}\"
            shopt -s nullglob
            wheels=(dist/*.whl)
            if (( ${#wheels[@]} != 1 )); then
              printf '%s\n' '::error::the dist directory must contain exactly one wheel file before repack' >&2
              printf '%s\n' 'dist directory file listing (including hidden files):' >&2
              ls -la -- dist >&2 || true
              exit 1
            fi
            wheel=\"${wheels[0]}\"
            if [[ ! -f \"$wheel\" || -L \"$wheel\" ]]; then
              printf '%s\n' '::error::the wheel to repack must be a regular file, not a symlink' >&2
              exit 1
            fi

            mkdir -p /tmp/origin /tmp/release
            existing=(/tmp/release/*.whl)
            if (( ${#existing[@]} != 0 )); then
              printf '%s\n' '::error::the repack output directory already contains wheel files' >&2
              exit 1
            fi
            WHEEL_FILE=\"${wheel##*/}\"
            cp -- \"$wheel\" \"/tmp/origin/$WHEEL_FILE\"
            revpkg --input \"/tmp/origin/${WHEEL_FILE}\" --output /tmp/release --new-version \"${RELEASE_VERSION}\"

            repacked=(/tmp/release/*.whl)
            if (( ${#repacked[@]} != 1 )); then
              printf '%s\n' '::error::repacking must produce exactly one wheel file' >&2
              exit 1
            fi
            if [[ ! -f \"${repacked[0]}\" || -L \"${repacked[0]}\" || ! -s \"${repacked[0]}\" ]]; then
              printf '%s\n' '::error::repacked artifact must be a non-empty regular wheel file, not a symlink' >&2
              exit 1
            fi
            # Keep the original file name of the build output; the next step renames it as required by the matrix.
            cp -- \"${repacked[0]}\" \"$wheel\"
            printf 'Repacked wheel: %s\n' \"$wheel\"
            "

      - name: Rename wheel
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${WHL_NAME:?WHL_NAME must not be empty}"
          if [[ ! "$WHL_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.+!-]*\.whl$ ]]; then
            printf '%s\n' '::error::WHL_NAME must be a wheel file name without path or special characters' >&2
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            printf '%s\n' '::error::the dist directory must contain exactly one wheel file after repack' >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          target="dist/$WHL_NAME"
          if [[ ! -f "$wheel" || -L "$wheel" ]]; then
            printf '%s\n' '::error::the wheel to rename must be a regular file, not a symlink' >&2
            exit 1
          fi
          # Only rename the file without modifying wheel-internal metadata; keep it as is when it already has the target name.
          if [[ "$wheel" != "$target" ]]; then
            if [[ -e "$target" || -L "$target" ]]; then
              printf '%s\n' '::error::the target wheel already exists, refusing to overwrite' >&2
              exit 1
            fi
            mv -- "$wheel" "$target"
          fi
          printf 'Wheel artifact: %s\n' "$target"

      - name: Upload wheel to Artifactory
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        shell: bash
        env:
          ARTIFACTORY_URL: https://download.t-head.cn/artifactory/pypi_generic/
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: |
          set -euo pipefail
          : "${RELEASE_USERNAME:?release username must not be empty}"
          : "${RELEASE_TOKEN:?release token must not be empty}"
          : "${RELEASE_VERSION:?RELEASE_VERSION must not be empty}"
          : "${WHL_NAME:?WHL_NAME must not be empty}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            printf '%s\n' '::error::no wheel file found in the dist directory' >&2
            exit 1
          fi

          # Validate all files and target paths first, then send upload requests carrying credentials.
          upload_urls=()
          for wheel in "${wheels[@]}"; do
            if [[ ! -f "$wheel" || -L "$wheel" ]]; then
              printf '%s\n' '::error::the upload artifact must be a regular wheel file, not a symlink' >&2
              exit 1
            fi
            upload_url="$(python3 - "$wheel" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import quote

          filename = Path(sys.argv[1]).name
          match = re.fullmatch(
              r"(?P<name>[A-Za-z0-9_][A-Za-z0-9_.]*)-"
              r"(?P<version>[0-9][A-Za-z0-9.!+_]*)-"
              r"(?:[0-9][A-Za-z0-9_.]*-)?"
              r"[A-Za-z0-9_.]+-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+\.whl",
              filename,
          )
          if match is None:
              raise SystemExit("::error::the wheel file name format is invalid")
          package_name = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name):
              raise SystemExit("::error::package_name must be a valid Python package name")
          normalize = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          if normalize(match["name"]) != normalize(package_name):
              raise SystemExit("::error::the wheel package name does not match package_name")
          release_version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", release_version):
              raise SystemExit("::error::RELEASE_VERSION must be a valid version directory name without path or special characters")
          whl_name = os.environ["WHL_NAME"]
          if filename != whl_name:
              raise SystemExit("::error::the uploaded wheel file name does not match WHL_NAME")
          components = (package_name, release_version, whl_name)
          print(os.environ["ARTIFACTORY_URL"].rstrip("/") + "/" + "/".join(quote(part, safe="") for part in components))
          PY
          )"
            upload_urls+=("$upload_url")
          done

          # The upload path is <package_name>/<release_version>/<whl_name>; builders must ensure wheel file names do not collide across matrix configurations.
          for index in "${!wheels[@]}"; do
            wheel="${wheels[$index]}"
            # Do not follow redirects to avoid sending artifacts or release credentials to other hosts.
            status="$(curl --fail --silent --show-error --retry 3 \
              --connect-timeout 30 --max-time 600 --proto '=https' \
              --user "$RELEASE_USERNAME:$RELEASE_TOKEN" \
              --upload-file "$wheel" --output /dev/null --write-out '%{http_code}' \
              -- "${upload_urls[$index]}")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              printf '%s\n' "::error::Artifactory upload failed, HTTP status: $status" >&2
              exit 1
            fi
            printf 'Uploaded %s\n' "${wheel##*/}"
          done

      - name: Save GitHub Release wheel artifacts
        # The specified version has passed matrix validation and the rc gate; also save release artifacts on branch triggers.
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' && (inputs.tag_version != '' || github.ref_type == 'tag') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-release-wheels-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Generate release data JSON
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          matrix = json.loads(os.environ["MATRIX_JSON"])
          package_name = os.environ["PACKAGE_NAME"]
          data = {
              "artifactName": package_name,
              "sdkVersion": matrix["sdk_version"],
              "item": package_name,
              "osTypeList": matrix["os_version"],
              "runtimeVersion": matrix["runtime_version"],
              "framework": matrix["torch_version"],
              "python": matrix["python_version"],
              "tag": matrix["tag"],
          }
          index = os.environ["MATRIX_INDEX"]
          if not re.fullmatch(r"[0-9]+", index):
              raise SystemExit("::error::the matrix index must be a non-negative integer")
          # Include the matrix index in the file name so each successful job's data is kept when downloads are merged at the end.
          output = Path(os.environ["RUNNER_TEMP"]) / "release-data" / f"release-{index}.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          with output.open("x", encoding="utf-8") as target:
              target.write(content)
          print(content, end="")
          PY

      - name: Save release data JSON
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-release-data-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release-data/release-${{ strategy.job-index }}.json
          if-no-files-found: error

      - name: Record matrix job success
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        shell: bash
        run: printf 'success\n' > "$RUNNER_TEMP/matrix-success.txt"

      - name: Save matrix job success marker
        if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-matrix-success-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/matrix-success.txt
          if-no-files-found: error

  publish-sdist:
    name: Publish sdist after at least one matrix job succeeds
    needs: [prepare-matrix, build-sdist, matrix-job]
    # Check success markers even when the matrix summary is failure; do not publish on cancellation, skip, or sdist build failure.
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.build-sdist.result == 'success' && (needs.matrix-job.result == 'success' || needs.matrix-job.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - name: Download success markers for this run attempt
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare-matrix.outputs.package_name }}-matrix-success-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: matrix-results
          merge-multiple: false

      - name: Determine whether any matrix job succeeded
        id: matrix-success
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          any_success = any(
              path.is_file() and not path.is_symlink() and path.read_text(encoding="utf-8") == "success\n"
              for path in Path("matrix-results").glob("*/matrix-success.txt")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"any_success={str(any_success).lower()}\n")
          print("Success detected, publishing sdist" if any_success else "No successful matrix jobs, skipping sdist publish")
          PY

      - name: Download sdist to publish
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-sdist.outputs.artifact_id }}
          path: sdist-dist
          merge-multiple: true

      - name: Set up Python for sdist publish
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Twine
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        shell: bash
        run: python -m pip install --no-input twine

      - name: Upload sdist to Artifactory
        id: publish
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        shell: bash
        env:
          ARTIFACTORY_URL: https://download.t-head.cn/artifactory/api/pypi/pypi_srcsupport/
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
          TWINE_USERNAME: ${{ secrets.release_username }}
          TWINE_PASSWORD: ${{ secrets.release_token }}
        run: |
          set -euo pipefail
          : "${TWINE_USERNAME:?release username must not be empty}"
          : "${TWINE_PASSWORD:?release token must not be empty}"
          shopt -s nullglob
          archives=(sdist-dist/*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            printf '%s\n' '::error::no sdist tar.gz file found to publish' >&2
            exit 1
          fi
          # Every artifact must map one-to-one to a deduplicated release version; uploads start only after all validations pass.
          python3 - "${archives[@]}" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from packaging.utils import canonicalize_name, InvalidSdistFilename, parse_sdist_filename
          from packaging.version import InvalidVersion, Version

          package_name = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name):
              raise SystemExit("::error::package_name must be a valid Python package name")
          try:
              entries = json.loads(os.environ["MATRIX_JSON"])["include"]
              if not isinstance(entries, list) or not entries:
                  raise ValueError
              expected = set()
              for entry in entries:
                  version = entry["release_version"]
                  if not isinstance(version, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", version):
                      raise ValueError
                  expected.add(Version(version))
          except (KeyError, TypeError, ValueError, InvalidVersion):
              raise SystemExit("::error::matrix must contain a valid release_version")

          found = set()
          for filename in sys.argv[1:]:
              archive = Path(filename)
              if not archive.is_file() or archive.is_symlink():
                  raise SystemExit("::error::the sdist must be a regular file, not a symlink")
              if not archive.stat().st_size:
                  raise SystemExit("::error::the sdist must not be empty")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*\.tar\.gz", archive.name):
                  raise SystemExit("::error::the sdist file name or version is invalid")
              try:
                  name, version = parse_sdist_filename(archive.name)
              except (InvalidSdistFilename, InvalidVersion):
                  raise SystemExit("::error::the sdist file name or version is invalid")
              if name != canonicalize_name(package_name):
                  raise SystemExit("::error::the sdist package name does not match package_name")
              if version not in expected or version in found:
                  raise SystemExit("::error::the sdist version is not in the matrix or is duplicated")
              found.add(version)
          if found != expected:
              raise SystemExit("::error::the sdist files are missing release_version entries from the matrix")
          PY

          for archive in "${archives[@]}"; do
            twine upload --repository-url "$ARTIFACTORY_URL" \
              --verbose --disable-progress-bar --non-interactive "$archive"
            printf 'Uploaded sdist %s\n' "${archive##*/}"
          done

  update-metadata:
    name: Update metadata
    needs: [prepare-matrix, publish-sdist]
    # Allow publishing after some wheels fail; never update when the sdist was not actually uploaded, failed, or was cancelled.
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.publish-sdist.result == 'success' && needs.publish-sdist.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout metadata tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: Set up Python for metadata update
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metadata dependencies
        shell: bash
        run: python -m pip install --no-input requests packaging

      - name: Generate and upload index.json
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: python ci-template/ci-workflows/release-pypi/scripts/get_metadata.py

  post-release-data:
    name: Push release data
    needs: [prepare-matrix, update-metadata]
    # Push only after the metadata updates succeed; the explicit status functions let releases with partial matrix failures continue.
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.update-metadata.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release data for this run attempt
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare-matrix.outputs.package_name }}-release-data-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-data
          merge-multiple: true

      - name: Checkout release data tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: Set up Python for release data
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release data dependencies
        shell: bash
        run: python -m pip install --no-input requests cryptography

      - name: Push release data one by one
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          CLIENT_PRIVATE_KEY_B64: ${{ secrets.data_token }}
        run: python ci-template/ci-workflows/release-pypi/scripts/post_data.py --input-dir release-data
