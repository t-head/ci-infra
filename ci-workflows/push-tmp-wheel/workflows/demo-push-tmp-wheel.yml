name: Demo Push Temporary Wheel

# Copy to .github/workflows/demo-push-tmp-wheel.yml in the caller repository before use.
# Manual runs publish to the real temporary repository; run only on trusted branches.
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Python package name, e.g. demo_package; also used as the temporary repository directory name'
        required: true
        type: string
      wheel_name:
        description: 'Full filename actually produced by the build, e.g. demo_package-1.2.3.dev1-py3-none-any.whl'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and save wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: tmp-wheel-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out caller code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python for the build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: bash
        run: python -m pip install --no-input build

      # Generic Python project example; replace the build environment and commands if hggcrt, PPU SDK, or other dependencies are required.
      # The project build configuration determines the version; wheel_name does not change the version or rename files.
      - name: Build wheel
        shell: bash
        run: python -m build --wheel --outdir "$RUNNER_TEMP/push-tmp-wheel-dist"

      - name: Save wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmp-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/push-tmp-wheel-dist/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Call temporary wheel upload template
    needs: build
    # For production, pin both @main and template_ref to the same full commit SHA in the template repository.
    uses: t-head/ci-infra/.github/workflows/push-tmp-wheel.yml@main
    with:
      package_name: ${{ inputs.package_name }}
      wheel_name: ${{ inputs.wheel_name }}
      # Use the actual artifact name from the build job output so rerunning only the publish job does not select a different run_attempt.
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      template_repository: t-head/ci-infra
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      # Enable as needed for private template repositories, and allow cross-repository calls in the template repository Actions settings.
      # template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show upload URL
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to logs and job summary
        shell: bash
        env:
          UPLOAD_URL: ${{ needs.publish.outputs.upload_url }}
        run: |
          set -euo pipefail
          printf 'Uploaded: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
